name: CI

# Builds and tests ROS2Plan on ROS 2 Humble (Ubuntu 22.04).
#
# The full PDDL/HDDL/PPDDL/RDDL matrix builds on both toolchains; the two legs exist to
# catch compiler-specific breakage, not to gate any feature:
#   * gcc11 — the stock Ubuntu 22.04 compiler, i.e. what a plain `colcon build` uses.
#   * gcc12 — the newer toolchain, to keep the sources warning- and error-clean there too.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: build-test (${{ matrix.name }})
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc11
            cc: gcc
            cxx: g++
          - name: gcc12
            cc: gcc-12
            cxx: g++-12
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          path: src/ROS2Plan
          submodules: recursive

      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git \
            gcc-12 g++-12 bison flex default-jdk \
            libboost-filesystem-dev \
            python3-colcon-common-extensions python3-rosdep
          rosdep update || true
          rosdep install --from-paths src --ignore-src -r -y || true

      - name: Build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} \
            colcon build --event-handlers console_cohesion+

      - name: Test
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          # The integration tests launch nodes under fixed names (ros2plan_knowledge_base and
          # friends), so any other ROS 2 system reachable on the same domain is indistinguishable
          # from the one under test and the tests query the wrong nodes. Run on a dedicated
          # domain. Sequential for the same reason plus fixed service timeouts, which flake when
          # packages' tests run concurrently on small runners.
          export ROS_DOMAIN_ID=78
          colcon test --executor sequential \
            --event-handlers console_cohesion+ --return-code-on-test-failure

      - name: Test results (summary)
        if: always()
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon test-result --verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: build/*/test_results/**
          if-no-files-found: ignore
